name: CI e deploy — Ser Capoeira

on:
  push:
    branches:
      - claude/quirky-volta-t94mlm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sercapoeira-deploy
  cancel-in-progress: false

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar nova foto do Professor Dinho
        id: preparar_foto
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_IMAGE='assets/img/fotos/otimizadas/Imagem do ChatGPT 19 de nov. de 2026, 00_30_34.png'

          if [[ -f "$SOURCE_IMAGE" ]]; then
            python3 -m venv "$RUNNER_TEMP/photo-venv"
            "$RUNNER_TEMP/photo-venv/bin/pip" install --disable-pip-version-check --quiet Pillow==11.3.0

            "$RUNNER_TEMP/photo-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import shutil

          source = Path("assets/img/fotos/otimizadas/Imagem do ChatGPT 19 de nov. de 2026, 00_30_34.png")
          originals = Path("assets/img/fotos/originais")
          originals.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, originals / "foto-26.png")

          image = ImageOps.exif_transpose(Image.open(source))
          if abs((image.width / image.height) - (675 / 1200)) > 0.01:
              raise SystemExit(f"Proporção inesperada para foto-26: {image.width}x{image.height}")

          if image.mode in ("RGBA", "LA") and image.getchannel("A").getextrema() != (255, 255):
              rgba = image.convert("RGBA")
              background = Image.new("RGBA", rgba.size, (255, 255, 255, 255))
              image = Image.alpha_composite(background, rgba).convert("RGB")
          else:
              image = image.convert("RGB")

          output_dir = Path("assets/img/fotos/otimizadas")
          for width, stem in ((480, "foto-26-480"), (675, "foto-26-g")):
              height = round(image.height * width / image.width)
              resized = image.resize((width, height), Image.Resampling.LANCZOS)
              resized.save(output_dir / f"{stem}.webp", "WEBP", quality=90, method=6)
              resized.save(
                  output_dir / f"{stem}.jpg",
                  "JPEG",
                  quality=92,
                  optimize=True,
                  progressive=True,
                  subsampling=0,
              )
              print(f"Gerado {stem}: {width}x{height}")

          source.unlink()
          PY

            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma nova foto pendente; mantendo as imagens atuais."
          fi

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Instalar Playwright para os testes
        run: npm install --no-save --no-package-lock playwright

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes funcionais e pentest
        shell: bash
        run: |
          set -euo pipefail

          site_root="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$site_root"
          }
          trap cleanup EXIT

          # Testa a mesma árvore pública que será enviada ao servidor.
          # Arquivos internos e originais nunca entram no document root.
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.github' \
            --exclude='./.claude' \
            --exclude='./.gitignore' \
            --exclude='./docs' \
            --exclude='./tools' \
            --exclude='./CLAUDE.md' \
            --exclude='./README.md' \
            --exclude='./_config.yml' \
            --exclude='./assets/img/fotos/originais' \
            --exclude='./assets/img/logo/antiga' \
            --exclude='./assets/img/logo/ser-capoeira-original.png' \
            --exclude='./assets/img/logo/ser-capoeira.png' \
            --exclude='./assets/img/logo/ser-capoeira-clara.png' \
            --exclude='./assets/img/logo/ser-capoeira-emblema.png' \
            --exclude='./assets/img/creditos/terminal404-original.png' \
            --exclude='./assets/img/favicon/favicon-16x16.png' \
            --exclude='./assets/img/favicon/favicon-32x32.png' \
            --exclude='./assets/img/favicon/favicon-48x48.png' \
            -czf - . | tar -xzf - -C "$site_root"

          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$site_root" >/tmp/sercapoeira-http.log 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null

          node tools/testes.js | tee /tmp/sercapoeira-testes.log
          if ! grep -Eq 'FALHAS: 0$' /tmp/sercapoeira-testes.log; then
            echo "::error::Os testes funcionais apresentaram falhas."
            exit 1
          fi

          node tools/pentest.js | tee /tmp/sercapoeira-pentest.log
          if grep -Eq '^FALHA ' /tmp/sercapoeira-pentest.log; then
            echo "::error::O pentest encontrou falhas."
            exit 1
          fi
          if grep -Eq '^AVISO ' /tmp/sercapoeira-pentest.log; then
            echo "::error::O pentest encontrou arquivos internos acessíveis na raiz pública."
            exit 1
          fi

      - name: Registrar as imagens otimizadas no GitHub
        id: commit_foto
        shell: bash
        env:
          PHOTO_CHANGED: ${{ steps.preparar_foto.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$PHOTO_CHANGED" == "true" ]]; then
            git add -A -- \
              'assets/img/fotos/otimizadas/Imagem do ChatGPT 19 de nov. de 2026, 00_30_34.png' \
              assets/img/fotos/originais/foto-26.png \
              assets/img/fotos/otimizadas/foto-26-480.webp \
              assets/img/fotos/otimizadas/foto-26-480.jpg \
              assets/img/fotos/otimizadas/foto-26-g.webp \
              assets/img/fotos/otimizadas/foto-26-g.jpg

            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "assets: atualizar foto do Professor Dinho"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar se os segredos de deploy foram configurados
        id: deploy_config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Testes passaram, mas o deploy ainda não foi ativado. Configure DEPLOY_SSH_KEY e DEPLOY_KNOWN_HOSTS nos Secrets do repositório."
          fi

      - name: Preparar autenticação SSH
        if: steps.deploy_config.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Publicar versão imutável no servidor
        if: steps.deploy_config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: 204.157.108.41
          DEPLOY_USER: deploy-sercapoeira
          DEPLOY_BASE: /var/www/sercapoeira
          RELEASE_SHA: ${{ steps.commit_foto.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::SHA do commit inválido."
            exit 1
          fi

          destination="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_BASE/releases/$RELEASE_SHA"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          ssh "${ssh_opts[@]}" "$destination" "mkdir -p '$release_dir'"

          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.github' \
            --exclude='./.claude' \
            --exclude='./.gitignore' \
            --exclude='./docs' \
            --exclude='./tools' \
            --exclude='./CLAUDE.md' \
            --exclude='./README.md' \
            --exclude='./_config.yml' \
            --exclude='./assets/img/fotos/originais' \
            --exclude='./assets/img/logo/antiga' \
            --exclude='./assets/img/logo/ser-capoeira-original.png' \
            --exclude='./assets/img/logo/ser-capoeira.png' \
            --exclude='./assets/img/logo/ser-capoeira-clara.png' \
            --exclude='./assets/img/logo/ser-capoeira-emblema.png' \
            --exclude='./assets/img/creditos/terminal404-original.png' \
            --exclude='./assets/img/favicon/favicon-16x16.png' \
            --exclude='./assets/img/favicon/favicon-32x32.png' \
            --exclude='./assets/img/favicon/favicon-48x48.png' \
            -czf - . | ssh "${ssh_opts[@]}" "$destination" "tar -xzf - -C '$release_dir'"

          ssh "${ssh_opts[@]}" "$destination" "set -eu; test -s '$release_dir/index.html'; find '$release_dir' -type d -exec chmod 2750 {} +; find '$release_dir' -type f -exec chmod 0640 {} +; ln -sfn '$release_dir' '$DEPLOY_BASE/.current-next-$GITHUB_RUN_ID'; mv -Tf '$DEPLOY_BASE/.current-next-$GITHUB_RUN_ID' '$DEPLOY_BASE/current'; echo 'Publicação ativada: $RELEASE_SHA'"

      - name: Registrar conclusão sem deploy (segredos pendentes)
        if: steps.deploy_config.outputs.ready != 'true'
        run: echo "CI concluída. A publicação será ativada assim que os dois Secrets SSH forem cadastrados."
